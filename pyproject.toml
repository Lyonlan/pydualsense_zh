# 项目元信息：名称/版本/描述/作者/关键词 等（用于打包与发布）
[project]
name = "pydualsense"
version = "0.7.5"
description = "use your DualSense (PS5) controller with python"
readme = "README.md"
requires-python = ">=3.8,<4.0"
license = { text = "MIT License" }
authors = [{ name = "Florian (flok) K", email = "37000563+flok@users.noreply.github.com" }]
keywords = ['ps5', 'controller', 'dualsense', 'pydualsense']

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Poetry 配置：包基本信息与包含路径（用于构建 wheel/sdist）
[tool.poetry]
name = "pydualsense"
version = "0.7.5"
description = "use your DualSense (PS5) controller with python"
license = "MIT"
repository = "https://github.com/flok/pydualsense"
authors = ["Florian (flok) K"]
readme = "README.md"
packages = [{include = "pydualsense"}]
include = ["pydualsense/hidapi.dll"]
keywords = ['ps5', 'controller', 'dualsense', 'pydualsense']
# 运行时依赖（安装库时需要的依赖）
[tool.poetry.dependencies]
python = ">=3.8,<4.0"
hidapi-usb = "^0.3.2" # HIDAPI 的 Python 封装，核心通信依赖

# 开发依赖（文档/任务/本地构建）
[tool.poetry.group.dev.dependencies]
python = ">=3.9,<4.0"
taskipy = "^1.12.2" # 任务脚本工具（poetry run task ...）
hidapi-usb = "^0.3.2"
sphinx = { version= "^7.3.7", python=">=3.9" } # 文档生成器
furo = "^2024.5.6" # Sphinx 主题（深/浅色）

# 类型检查相关依赖（mypy 与类型补充）
[tool.poetry.group.typing.dependencies]
mypy = "^1.3.0"
types-python-dateutil = "^2.8.19"
types-pytz = ">=2022.7.1.2"

# 任务脚本：构建/清理/文档构建 等快捷命令
[tool.taskipy.tasks]
clear = "find pydualsense/ -type f \\( -iname \\*.c -o -iname \\*.cpp -o -iname \\*.pyd -o -iname \\*.so \\) -delete"
build = "poetry build"
html_docs = "make html -C docs"
html_docs_zh = "make html-zh -C docs"
docs_clean = "make clean -C docs"
docs_clean_zh = "make clean-zh -C docs"
html_docs_all = "make clean -C docs && make html -C docs && make clean-zh -C docs && make html-zh -C docs"
post_build = "task clear"
post_test = "task clear"

# 版本自动递增关联文件（发布流程可用）
[tool.poetry_bumpversion.file."pydualsense/__init__.py"]
[tool.poetry_bumpversion.file."pyproject.toml"]

# 代码检查工具 Ruff 的全局配置
# 说明：
# - fix = true：自动修复安全可修的风格问题
# - unfixable：明确哪些规则不自动修复（避免误删注释代码等）
[tool.ruff]
fix = true
unfixable = [
    "ERA", # 不自动移除被注释的代码
]
# 选择启用的一组规则集合（集成多插件规则）
extend-select = [
    "B",   # bugbear：常见代码坏味道
    "C4",  # comprehensions：推导式优化
    "ERA", # eradicate：删除死代码（受 unfixable 控制）
    "I",   # isort：导入排序
    "N",   # pep8-naming：命名规范
    "PIE", # flake8-pie：小优化建议
    "PGH", # pygrep：基于模式的提醒
    "RUF", # ruff 内置检查
    "SIM", # simplify：简化代码
    "TCH", # type-checking：类型相关导入
    "TID", # tidy-imports：导入整理
    "UP",  # pyupgrade：升级语法
]
# 在本项目中全局忽略的规则（主要是风格类告警）
ignore = [
    "B904", # 建议使用 'raise ... from err'
    "B905", # zip() 需要显式 strict= 参数
    "N818", # 异常类命名需以 Error 结尾
    "RUF001", # Unicode 风格（保留中文）
    "N816",   # 变量命名风格
    "ERA001", # 检测到注释代码
    "N802",   # 函数命名风格
    "N806",   # 变量命名风格
    # 注解类规则（示例代码允许缺少类型注解）
    "ANN001", # 函数参数缺少类型注解
    "ANN201", # 公共函数缺少返回类型注解
    "ANN202", # 私有函数缺少返回类型注解
    # 中文全角标点（注释/文档字符串）保留
    "RUF002", # 文档字符串含有歧义 unicode
    "RUF003", # 注释含有歧义 unicode
    # 参数命名风格（例如 forceID）
    "N803",   # 参数名应为小写
]
# 目标 Python 版本（用于语法/规则的判断）
target-version = "py38"
# 排除目录
exclude = [".venv"]
# 每行最大长度
line-length = 120

# 类型检查工具 mypy 的全局配置
# 说明：
# - strict = true：启用更严格的类型检查
# - files = "pydualsense"：仅检查库源码（示例 examples 不强制）
# - warn_unused_ignores：提示未使用的忽略标记
[tool.mypy]
strict = true
files = "pydualsense"
show_error_codes = true
pretty = true
warn_unused_ignores = true
enable_incomplete_feature = ["Unpack"]
exclude = [
    "^docs\\.py$",
    "^build\\.py$",
]

# 为示例和库代码放宽“必须有类型注解”的限制，避免纯示例触发严格模式
[[tool.mypy.overrides]]
module = ["examples.*", "pydualsense.*"]
disallow_untyped_defs = false
check_untyped_defs = false

# 进一步关闭库内部的风格类类型错误，以免影响示例校验
[[tool.mypy.overrides]]
module = ["pydualsense.*"]
disable_error_code = ["no-untyped-def", "assignment", "no-redef", "unused-ignore", "import-untyped"]

# 构建系统：声明使用 poetry-core 作为 PEP 517 构建后端
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
